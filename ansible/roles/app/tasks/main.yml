---
- name: Update apt cache
  apt:
    update_cache: yes

- name: Install Node.js, npm, and tmux
  apt:
    name:
      - nodejs
      - npm
      - tmux
    state: present

- name: Clone the Node.js service repository
  git:
    repo: 'https://github.com/jjk66/node-service-deployment.git'
    dest: /var/www/hello-world
    version: main
    force: yes

- name: Install application dependencies
  npm:
    path: /var/www/hello-world

- name: Start the Node.js application inside a detached tmux session on port 8080
  shell: "tmux new-session -d -s node_app 'PORT=8080 node /var/www/hello-world/app.js'"
