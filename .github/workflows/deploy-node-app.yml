---
name: Deploy Node.js Application using a test container as the droplet host
on:
  workflow_dispatch:

jobs:
  deploy-locally:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image for local-droplet
        run: docker build -t local-droplet:latest .

      - name: Run local-droplet container
        run: docker run -d --name my-ansible-node -p 2222:22 -p 8080:8080 local-droplet:latest

      - name: Wait for the container to be ready
        run: |
          echo "Waiting for the container to be ready..."
          for i in {1..30}; do
            if docker exec my-ansible-node pgrep sshd > /dev/null; then
              echo "SSH is running inside the container. Container is ready!"
              break
            fi
            echo "Waiting for 2 seconds..."
            sleep 2
          done

      - name: Setup SSH Private Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_github_runner
          chmod 600 ~/.ssh/id_github_runner

      - name: Install Ansible Dependencies
        run: |
          echo "Installing Ansible dependencies..."
          sudo apt-get update
          sudo apt-get install -y ansible
          ansible-galaxy collection install community.docker

      - name: Setup SSH Private Key
        run: |
          mkdir -p ~/.ssh
          # Write to id_github_runner for your manual/local overrides
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_github_runner
          chmod 600 ~/.ssh/id_github_runner

          # ALSO write to id_rsa so it satisfies the path hardcoded in your hosts.yml!
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Run Ansible playbook to deploy Node.js application
        working-directory: ./ansible
        run: ansible-playbook -i inventories/hosts.yml node_service.yml --tags app --private-key ~/.ssh/id_github_runner

      - name: Verify deployment
        run: |
          echo "Verifying deployment..."
          sleep 10
          if curl -s --fail http://localhost:8080 | grep -q "Hello, World!"; then
            echo "Deployment successful!"
          else
            echo "Deployment verification failed!"
            echo "============"
            echo "Docker container processes:"
            docker exec my-ansible-node ps aux
            echo "============"
            echo "tmux session capture (node output):"
            docker exec my-ansible-node tmux capture-pane -pt node_app || echo "No tmux session found."
            echo "============"
            exit 1
          fi

      - name: Stop and remove local-droplet container
        if: always()
        run: |
          echo "Stopping and removing the local-droplet container..."
          docker stop my-ansible-node || true
          docker rm my-ansible-node || true
